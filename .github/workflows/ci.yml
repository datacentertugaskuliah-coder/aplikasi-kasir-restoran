name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend deps
        working-directory: ./backend
        run: npm install --if-present
      - name: Lint check (placeholder)
        run: echo "Lint step akan diaktifkan setelah package.json tersedia"
